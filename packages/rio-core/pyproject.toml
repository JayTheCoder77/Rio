[project]
name = "rio-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2",
    "pytest>=9.1.1",
    "unidiff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rio_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
